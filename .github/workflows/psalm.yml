name: Static Analysis (Psalm)
on: push

# Nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  psalm:
    name: Psalm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: gmp, mbstring
          coverage: none

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Psalm
        run: vendor/bin/psalm --show-info=false --find-unused-psalm-suppress --no-progress
